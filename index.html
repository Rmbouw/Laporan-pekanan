<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Tahfizh An-Najah Kls VIII</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    #canvas-wrapper {
      width: 100%;
      max-width: 1300px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #mainCanvas {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen flex flex-col lg:flex-row">

  <!-- SIDEBAR CONTROL -->
  <div class="w-full lg:w-[420px] bg-white p-5 lg:p-6 shadow-2xl overflow-y-auto max-h-screen flex-shrink-0 z-20">
    <div class="border-b pb-3 mb-4">
      <h2 class="text-xl font-bold text-emerald-800 flex items-center gap-2">
        <span>📖</span> Laporan Tahfizh Kls 8
      </h2>
      <p class="text-xs text-slate-500">◀• ılıılıılıılılılılı.1:2</p>
    </div>

    <!-- Header & Logo Input -->
    <div class="space-y-3 mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200">
      <h3 class="font-bold text-xs uppercase text-slate-600">Informasi</h3>
      <div>
        <label class="block text-xs font-semibold mb-1">Judul Utama</label>
        <input type="text" id="input-judul" value="LAPORAN PEKANAN TAHFIZH" oninput="drawCanvas()" class="w-full p-2 border rounded text-xs">
      </div>
      <div>
        <label class="block text-xs font-semibold mb-1">Nama Kelas</label>
        <input type="text" id="input-kelas" value="KELAS VIII An-Najah" oninput="drawCanvas()" class="w-full p-2 border rounded text-xs">
      </div>
      <div>
        <label class="block text-xs font-semibold mb-1">Rentang Tanggal & Tahun</label>
        <input type="text" id="input-periode" value="20 - 24 JULI 2026" oninput="drawCanvas()" class="w-full p-2 border rounded text-xs">
      </div>
      <div>
        <label class="block text-xs font-semibold mb-1">Nama Sekolah</label>
        <input type="text" id="input-instansi" value="Sekolah Tahfidz Sahabat Qur'an" oninput="drawCanvas()" class="w-full p-2 border rounded text-xs">
      </div>
      <div>
        <label class="block text-xs font-semibold mb-1">Upload Logo Sekolah (STSQ)</label>
        <input type="file" id="input-logo" accept="image/*" onchange="updateLogo(event)" class="w-full p-1 border rounded text-xs">
      </div>
    </div>

    <div class="grid grid-cols-2 gap-2 mb-6">
      <button onclick="downloadPNG()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl text-xs shadow-md transition flex items-center justify-center gap-1">
        <span></span> Unduh PNG
      </button>
      <button onclick="downloadPDF()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-xl text-xs shadow-md transition flex items-center justify-center gap-1">
        <span></span> Unduh PDF
      </button>
    </div>

    <!-- Form Santri -->
    <div class="space-y-3">
      <h3 class="font-bold text-xs uppercase text-slate-600">Data 8 Santri</h3>
      <div id="form-container" class="space-y-2"></div>
    </div>
  </div>

  <div class="flex-1 p-3 sm:p-6 overflow-auto flex items-center justify-center bg-slate-800">
    <div id="canvas-wrapper">
      <canvas id="mainCanvas" width="1300" height="960"></canvas>
    </div>
  </div>

  <script>
    let customLogoImg = null;

    // Data Santri dengan 4 nama baru di baris bawah: MIZAN, FATIH, IHSAN, DZULFIKAR
    const defaultData = [
      { nama: "AKHDAN", hafalan: "2 Juz 4 HLM", ziyadah: "1 HLM", murojaah: "2 Juz 4 HLM", catatan: "Semangat dan maksimalkan hafalan lagi di pekan berikutnya.", fotoImg: null },
      { nama: "FATEH", hafalan: "2 Juz 4 HLM", ziyadah: "1 HLM", murojaah: "2 Juz 4 HLM", catatan: "Semangat dan maksimalkan target hafalan lagi.", fotoImg: null },
      { nama: "CAVA", hafalan: "1 Juz 13 HLM", ziyadah: "3 HLM", murojaah: "1 Juz 13 HLM", catatan: "Semangat dan maksimalkan target hafalan lagi.", fotoImg: null },
      { nama: "SYAFIQ", hafalan: "9 Juz", ziyadah: "20 HLM", murojaah: "9 JUZ", catatan: "Dikuatkan lagi hafalan agar tidak mudah lupa.", fotoImg: null },
      { nama: "MIZAN", hafalan: "3 Juz 2 HLM", ziyadah: "2 HLM", murojaah: "3 Juz", catatan: "Fokus pada kelancaran juz 30. Tingkatkan muraja'ah.", fotoImg: null },
      { nama: "FATIH", hafalan: "5 Juz 10 HLM", ziyadah: "4 HLM", murojaah: "4 Juz", catatan: "Alhamdulillah ziyadah pekan ini lancar.", fotoImg: null },
      { nama: "IHSAN", hafalan: "2 Juz", ziyadah: "1.5 HLM", murojaah: "2 Juz", catatan: "Perbaiki panjang pendek (mad) pada juz 29.", fotoImg: null },
      { nama: "DZULFIKAR", hafalan: "4 Juz 5 HLM", ziyadah: "3 HLM", murojaah: "4 Juz", catatan: "Pencapaian sangat baik pekan ini. Pertahankan!", fotoImg: null }
    ];

    let santriData = [...defaultData];

    function renderForms() {
      const container = document.getElementById('form-container');
      container.innerHTML = '';
      santriData.forEach((item, i) => {
        const details = document.createElement('details');
        details.className = 'bg-slate-50 rounded-lg border p-2 text-xs';
        if (i === 0) details.open = true;
        details.innerHTML = `
          <summary class="font-bold cursor-pointer text-slate-700">Santri #${i+1}: ${item.nama}</summary>
          <div class="space-y-2 pt-2">
            <input type="text" value="${item.nama}" oninput="updateData(${i}, 'nama', this.value)" class="w-full p-1.5 border rounded" placeholder="Nama">
            <input type="file" accept="image/*" onchange="updateFoto(${i}, event)" class="w-full p-1 border rounded text-[10px]">
            <div class="grid grid-cols-2 gap-1">
              <input type="text" value="${item.hafalan}" oninput="updateData(${i}, 'hafalan', this.value)" class="p-1.5 border rounded" placeholder="Hafalan">
              <input type="text" value="${item.ziyadah}" oninput="updateData(${i}, 'ziyadah', this.value)" class="p-1.5 border rounded" placeholder="Ziyadah">
            </div>
            <input type="text" value="${item.murojaah}" oninput="updateData(${i}, 'murojaah', this.value)" class="w-full p-1.5 border rounded" placeholder="Murojaah">
            <textarea oninput="updateData(${i}, 'catatan', this.value)" class="w-full p-1.5 border rounded h-16" placeholder="Catatan">${item.catatan}</textarea>
          </div>
        `;
        container.appendChild(details);
      });
    }

    function updateData(i, field, val) {
      santriData[i][field] = val;
      drawCanvas();
    }

    function updateFoto(i, e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          const img = new Image();
          img.onload = () => {
            santriData[i].fotoImg = img;
            drawCanvas();
          };
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function updateLogo(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          const img = new Image();
          img.onload = () => {
            customLogoImg = img;
            drawCanvas();
          };
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function drawCanvas() {
      const canvas = document.getElementById('mainCanvas');
      const ctx = canvas.getContext('2d');

      // 1. Latar Belakang Hijau Islami
      ctx.fillStyle = "#8bae9a";
      ctx.fillRect(0, 0, 1300, 960);

      // 2. Ornamen Bingkai Luar Islami
      ctx.strokeStyle = "#044e3a";
      ctx.lineWidth = 6;
      ctx.strokeRect(15, 15, 1270, 930);

      ctx.strokeStyle = "#d97706"; // Warna Emas/Amber
      ctx.lineWidth = 2;
      ctx.strokeRect(22, 22, 1256, 916);

      // Header Variables
      const judul = document.getElementById('input-judul').value;
      const kelas = document.getElementById('input-kelas').value;
      const periode = document.getElementById('input-periode').value;
      const instansi = document.getElementById('input-instansi').value;

      // Judul Utama (Ukuran Diperbesar)
      ctx.fillStyle = "#033829";
      ctx.font = "bold 36px Arial";
      ctx.fillText(`📖 ${judul}`, 45, 55);

      // Nama Kelas
      ctx.fillStyle = "#065f46";
      ctx.font = "bold 28px Arial";
      ctx.fillText(kelas, 82, 85);

      // Badge Periode Tanggal
      ctx.fillStyle = "#044e3a";
      ctx.beginPath();
      ctx.roundRect(80, 98, 250, 34, 8);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 15px Arial";
      ctx.fillText(`[ ${periode} ]`, 98, 120);

      const instansiWidth = ctx.measureText(instansi).width;
      const boxWidth = Math.max(300, instansiWidth + 85);
      const boxX = 1250 - boxWidth;

      ctx.fillStyle = "rgba(255, 255, 255, 0.92)";
      ctx.beginPath();
      ctx.roundRect(boxX, 30, boxWidth, 75, 14);
      ctx.fill();
      ctx.strokeStyle = "#d97706";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      const logoX = boxX + 12;
      const logoY = 40;
      const logoSize = 55;

      if (customLogoImg) {
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(logoX, logoY, logoSize, logoSize, 10);
        ctx.clip();
        ctx.drawImage(customLogoImg, logoX, logoY, logoSize, logoSize);
        ctx.restore();
      } else {
        ctx.fillStyle = "#044e3a";
        ctx.beginPath();
        ctx.roundRect(logoX, logoY, logoSize, logoSize, 10);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 14px Arial";
        ctx.fillText("STSQ", logoX + 8, logoY + 33);
      }

      ctx.fillStyle = "#033829";
      ctx.font = "bold 15px Arial";
      wrapText(ctx, instansi, logoX + 68, 62, boxWidth - 80, 18);

      ctx.strokeStyle = "rgba(4, 78, 58, 0.3)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(45, 145);
      ctx.lineTo(1250, 145);
      ctx.stroke();

      const startX = 45;
      const startY = 160;
      const cardW = 285;
      const cardH = 365;
      const gapX = 20;
      const gapY = 22;

      santriData.forEach((s, idx) => {
        const col = idx % 4;
        const row = Math.floor(idx / 4);
        const x = startX + col * (cardW + gapX);
        const y = startY + row * (cardH + gapY);

        // Frame Kartu Utama
        ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
        ctx.beginPath();
        ctx.roundRect(x, y, cardW, cardH, 18);
        ctx.fill();
        ctx.strokeStyle = "#044e3a";
        ctx.lineWidth = 2;
        ctx.stroke();

        const photoX = x + (cardW - 90) / 2;
        const photoY = y + 14;
        ctx.fillStyle = "#e2e8f0";
        ctx.beginPath();
        ctx.roundRect(photoX, photoY, 90, 105, 10);
        ctx.fill();
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 3;
        ctx.stroke();

        if (s.fotoImg) {
          ctx.save();
          ctx.beginPath();
          ctx.roundRect(photoX, photoY, 90, 105, 10);
          ctx.clip();
          ctx.drawImage(s.fotoImg, photoX, photoY, 90, 105);
          ctx.restore();
        } else {
          ctx.fillStyle = "#64748b";
          ctx.font = "bold 11px Arial";
          ctx.fillText("Foto Santri", photoX + 16, photoY + 58);
        }

        // Name Badge Emas/Kuning
        ctx.fillStyle = "#fef08a";
        ctx.beginPath();
        ctx.roundRect(x + 35, y + 125, cardW - 70, 26, 6);
        ctx.fill();
        ctx.strokeStyle = "#eab308";
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.fillStyle = "#0f172a";
        ctx.font = "bold 13px Arial";
        ctx.textAlign = "center";
        ctx.fillText(s.nama || "SANTRI", x + cardW / 2, y + 142);
        ctx.textAlign = "left";

        // Pita Indikator Hafalan (Teks Diperbesar)
        const drawRibbon = (ry, label, val) => {
          ctx.fillStyle = "#fef08a";
          ctx.beginPath();
          ctx.roundRect(x + 12, ry, cardW - 24, 25, 7);
          ctx.fill();

          ctx.fillStyle = "#1e293b";
          ctx.font = "15.5px Arial";
          ctx.fillText(`📖 ${label}: `, x + 18, ry + 17);
          ctx.font = "bold 15.5px Arial";
          ctx.fillText(val, x + 18 + ctx.measureText(`📖 ${label}: `).width, ry + 17);
        };

        drawRibbon(y + 158, "Jumlah hafalan", s.hafalan);
        drawRibbon(y + 188, "Ziyadah Pekan ini", s.ziyadah);
        drawRibbon(y + 218, "Muraja'ah", s.murojaah);

        // Kotak Catatan Evaluasi (Lebih Luas)
        const notesY = y + 250;
        const notesH = 102;
        ctx.fillStyle = "#fef08a";
        ctx.beginPath();
        ctx.roundRect(x + 12, notesY, cardW - 24, notesH, 10);
        ctx.fill();
        ctx.strokeStyle = "#fde047";
        ctx.stroke();

        ctx.fillStyle = "#713f12";
        ctx.font = "bold 15.5px Arial";
        ctx.fillText(" Catatan:", x + 18, notesY + 18);

        // Multiline Text Catatan
        ctx.fillStyle = "#1e293b";
        ctx.font = "13.5px Arial";
        wrapText(ctx, s.catatan || "-", x + 18, notesY + 34, cardW - 36, 14);
      });

      // 4. Footer
      ctx.fillStyle = "#033829";
      ctx.font = "bold 12px Arial";
      ctx.fillText("* Laporan Resmi Divisi Tahfizh", 45, 938);
      ctx.fillText(instansi, 1250 - ctx.measureText(instansi).width, 938);
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      for (let n = 0; n < words.length; n++) {
        let testLine = line + words[n] + ' ';
        let metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          ctx.fillText(line, x, y);
          line = words[n] + ' ';
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, x, y);
    }

    function downloadPNG() {
      const canvas = document.getElementById('mainCanvas');
      const a = document.createElement('a');
      a.download = `Laporan-Tahfizh-${Date.now()}.png`;
      a.href = canvas.toDataURL('image/png');
      a.click();
    }

    function downloadPDF() {
      const canvas = document.getElementById('mainCanvas');
      const imgData = canvas.toDataURL('image/png');
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('landscape', 'mm', 'a4');
      pdf.addImage(imgData, 'PNG', 0, 0, 297, (canvas.height * 297) / canvas.width);
      pdf.save(`Laporan-Tahfizh-${Date.now()}.pdf`);
    }

    renderForms();
    drawCanvas();
  </script>
</body>
</html>
