<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generator Laporan Tahfizh - Auto Save Storage</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    #canvas-wrapper {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    .canvas-preview {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 15px 25px -5px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen flex flex-col lg:flex-row">

  <!-- SIDEBAR CONTROL -->
  <div class="w-full lg:w-[420px] bg-white p-5 lg:p-6 shadow-2xl overflow-y-auto max-h-screen flex-shrink-0 z-20">
    <div class="border-b pb-3 mb-4 flex items-center justify-between">
      <div>
        <h2 class="text-xl font-bold text-emerald-800 flex items-center gap-2">
          <span>🕌</span> LAPORAN TAHFIDZ
        </h2>
        <p class="text-xs text-slate-500">بسم الله الرحمن الرحيم</p>
      </div>
      <span class="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-2 py-1 rounded">Auto-Saved 💾</span>
    </div>

    <!-- Header Inputs -->
    <div class="space-y-3 mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200">
      <h3 class="font-bold text-xs uppercase text-slate-600">Informasi Umum</h3>
      <div>
        <label class="block text-xs font-semibold mb-1">Judul Utama</label>
        <input type="text" id="input-judul" value="LAPORAN PEKANAN TAHFIZH" oninput="saveTextHeader()" class="w-full p-2 border rounded text-xs">
      </div>
      <div>
        <label class="block text-xs font-semibold mb-1">Nama Kelas</label>
        <input type="text" id="input-kelas" value="KELAS VIII An-Najah" oninput="saveTextHeader()" class="w-full p-2 border rounded text-xs">
      </div>
      <div>
        <label class="block text-xs font-semibold mb-1">Rentang Tanggal & Tahun</label>
        <input type="text" id="input-periode" value="20 - 24 JULI 2026" oninput="saveTextHeader()" class="w-full p-2 border rounded text-xs">
      </div>
      <div>
        <label class="block text-xs font-semibold mb-1">Nama Sekolah</label>
        <input type="text" id="input-instansi" value="Sekolah Tahfidz Sahabat Qur'an" oninput="saveTextHeader()" class="w-full p-2 border rounded text-xs">
      </div>
      <div>
        <label class="block text-xs font-semibold mb-1">Upload Logo Sekolah (STSQ)</label>
        <input type="file" id="input-logo" accept="image/*" onchange="updateLogo(event)" class="w-full p-1 border rounded text-xs">
      </div>
    </div>

    <!-- Export Buttons -->
    <div class="grid grid-cols-2 gap-2 mb-6">
      <button onclick="downloadPNG()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl text-xs shadow-md transition flex items-center justify-center gap-1">
        <span>📥</span> Unduh 2 PNG
      </button>
      <button onclick="downloadPDF()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-xl text-xs shadow-md transition flex items-center justify-center gap-1">
        <span>📄</span> Unduh PDF (2 Hal)
      </button>
    </div>

    <!-- Form Santri -->
    <div class="space-y-3 mb-6">
      <h3 class="font-bold text-xs uppercase text-slate-600">Data 8 Santri</h3>
      <div id="form-container" class="space-y-2"></div>
    </div>

    <!-- Reset Button -->
    <div class="border-t pt-4">
      <button onclick="clearAllData()" class="w-full bg-slate-100 hover:bg-rose-100 text-slate-600 hover:text-rose-700 border border-slate-300 font-semibold py-2 px-3 rounded-lg text-xs transition">
        🗑️ Reset Semua Foto & Data ke Default
      </button>
    </div>
  </div>

  <!-- CANVAS PREVIEW AREA -->
  <div class="flex-1 p-4 sm:p-6 overflow-auto flex justify-center bg-slate-800">
    <div id="canvas-wrapper">
      <div>
        <span class="text-white text-xs font-bold mb-1 block">HALAMAN 1 (Santri 1 - 4)</span>
        <canvas id="canvasPage1" width="1200" height="900" class="canvas-preview"></canvas>
      </div>
      <div>
        <span class="text-white text-xs font-bold mb-1 block">HALAMAN 2 (Santri 5 - 8)</span>
        <canvas id="canvasPage2" width="1200" height="900" class="canvas-preview"></canvas>
      </div>
    </div>
  </div>

  <script>
    let customLogoImg = null;

    const defaultData = [
      { nama: "AKHDAN", hafalan: "2 Juz 4 HLM", ziyadah: "1 HLM", murojaah: "2 Juz 4 HLM", catatan: "Semangat dan maksimalkan hafalan lagi di pekan berikutnya.", fotoImg: null },
      { nama: "FATEH", hafalan: "2 Juz 4 HLM", ziyadah: "1 HLM", murojaah: "2 Juz 4 HLM", catatan: "Semangat dan maksimalkan target hafalan lagi.", fotoImg: null },
      { nama: "CAVA", hafalan: "1 Juz 13 HLM", ziyadah: "3 HLM", murojaah: "1 Juz 13 HLM", catatan: "Semangat dan maksimalkan target hafalan lagi.", fotoImg: null },
      { nama: "SYAFIQ", hafalan: "9 Juz", ziyadah: "20 HLM", murojaah: "9 JUZ", catatan: "Dikuatkan lagi hafalan agar tidak mudah lupa.", fotoImg: null },
      { nama: "MIZAN", hafalan: "3 Juz 2 HLM", ziyadah: "2 HLM", murojaah: "3 Juz", catatan: "Fokus pada kelancaran juz 30. Tingkatkan muraja'ah.", fotoImg: null },
      { nama: "FATIH", hafalan: "5 Juz 10 HLM", ziyadah: "4 HLM", murojaah: "4 Juz", catatan: "Alhamdulillah ziyadah pekan ini lancar.", fotoImg: null },
      { nama: "IHSAN", hafalan: "2 Juz", ziyadah: "1.5 HLM", murojaah: "2 Juz", catatan: "Perbaiki panjang pendek (mad) pada juz 29.", fotoImg: null },
      { nama: "DZULFIKAR", hafalan: "4 Juz 5 HLM", ziyadah: "3 HLM", murojaah: "4 Juz", catatan: "Pencapaian sangat baik pekan ini. Pertahankan!", fotoImg: null }
    ];

    let santriData = [...defaultData];

    // INITALIZATION & LOCALSTORAGE MANAGEMENT
    window.onload = () => {
      loadSavedData();
      renderForms();
      drawAllCanvases();
    };

    function saveTextHeader() {
      const headerData = {
        judul: document.getElementById('input-judul').value,
        kelas: document.getElementById('input-kelas').value,
        periode: document.getElementById('input-periode').value,
        instansi: document.getElementById('input-instansi').value
      };
      localStorage.setItem('tahfizh_header_data', JSON.stringify(headerData));
      drawAllCanvases();
    }

    function saveSantriTextData() {
      const cleanData = santriData.map(s => ({
        nama: s.nama,
        hafalan: s.hafalan,
        ziyadah: s.ziyadah,
        murojaah: s.murojaah,
        catatan: s.catatan
      }));
      localStorage.setItem('tahfizh_santri_data', JSON.stringify(cleanData));
    }

    function loadSavedData() {
      // 1. Muat Teks Header
      const savedHeader = localStorage.getItem('tahfizh_header_data');
      if (savedHeader) {
        const parsedHeader = JSON.parse(savedHeader);
        if (parsedHeader.judul) document.getElementById('input-judul').value = parsedHeader.judul;
        if (parsedHeader.kelas) document.getElementById('input-kelas').value = parsedHeader.kelas;
        if (parsedHeader.periode) document.getElementById('input-periode').value = parsedHeader.periode;
        if (parsedHeader.instansi) document.getElementById('input-instansi').value = parsedHeader.instansi;
      }

      // 2. Muat Teks Santri
      const savedSantriText = localStorage.getItem('tahfizh_santri_data');
      if (savedSantriText) {
        const parsedSantri = JSON.parse(savedSantriText);
        parsedSantri.forEach((item, i) => {
          if (santriData[i]) {
            santriData[i].nama = item.nama;
            santriData[i].hafalan = item.hafalan;
            santriData[i].ziyadah = item.ziyadah;
            santriData[i].murojaah = item.murojaah;
            santriData[i].catatan = item.catatan;
          }
        });
      }

      // 3. Muat Logo Sekolah (Base64)
      const savedLogo = localStorage.getItem('tahfizh_logo_base64');
      if (savedLogo) {
        const img = new Image();
        img.onload = () => {
          customLogoImg = img;
          drawAllCanvases();
        };
        img.src = savedLogo;
      }

      // 4. Muat 8 Foto Santri (Base64)
      santriData.forEach((santri, i) => {
        const savedFoto = localStorage.getItem(`tahfizh_foto_santri_${i}`);
        if (savedFoto) {
          const img = new Image();
          img.onload = () => {
            santriData[i].fotoImg = img;
            drawAllCanvases();
          };
          img.src = savedFoto;
        }
      });
    }

    // HELPER: KOMPRESI GAMBAR AGAR TIDAK MEMENUHI LOCALSTORAGE
    function resizeAndCompressImage(file, maxWidth, maxHeight, quality, callback) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > maxWidth) {
              height *= maxWidth / width;
              width = maxWidth;
            }
          } else {
            if (height > maxHeight) {
              width *= maxHeight / height;
              height = maxHeight;
            }
          }

          canvas.width = width;
          canvas.height = height;

          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          // Return JPEG Base64 terkompresi
          const dataUrl = canvas.toDataURL('image/jpeg', quality);
          callback(dataUrl, img);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function updateFoto(i, e) {
      const file = e.target.files[0];
      if (file) {
        // Kompres foto santri ke max 400x500
        resizeAndCompressImage(file, 400, 500, 0.75, (base64Str, imgObj) => {
          try {
            localStorage.setItem(`tahfizh_foto_santri_${i}`, base64Str);
          } catch (err) {
            alert('Penyimpanan lokal penuh. Hapus beberapa foto lama.');
          }
          santriData[i].fotoImg = imgObj;
          drawAllCanvases();
        });
      }
    }

    function updateLogo(e) {
      const file = e.target.files[0];
      if (file) {
        // Kompres logo sekolah ke max 200x200
        resizeAndCompressImage(file, 200, 200, 0.8, (base64Str, imgObj) => {
          try {
            localStorage.setItem('tahfizh_logo_base64', base64Str);
          } catch (err) {
            alert('Penyimpanan lokal penuh.');
          }
          customLogoImg = imgObj;
          drawAllCanvases();
        });
      }
    }

    function renderForms() {
      const container = document.getElementById('form-container');
      container.innerHTML = '';
      santriData.forEach((item, i) => {
        const details = document.createElement('details');
        details.className = 'bg-slate-50 rounded-lg border p-2 text-xs';
        if (i === 0) details.open = true;
        details.innerHTML = `
          <summary class="font-bold cursor-pointer text-slate-700">Santri #${i+1}: ${item.nama}</summary>
          <div class="space-y-2 pt-2">
            <input type="text" value="${item.nama}" oninput="updateData(${i}, 'nama', this.value)" class="w-full p-1.5 border rounded" placeholder="Nama">
            <div>
              <label class="block text-[10px] text-slate-500 mb-0.5">Upload Foto Santri #${i+1}</label>
              <input type="file" accept="image/*" onchange="updateFoto(${i}, event)" class="w-full p-1 border rounded text-[10px]">
            </div>
            <div class="grid grid-cols-2 gap-1">
              <input type="text" value="${item.hafalan}" oninput="updateData(${i}, 'hafalan', this.value)" class="p-1.5 border rounded" placeholder="Hafalan">
              <input type="text" value="${item.ziyadah}" oninput="updateData(${i}, 'ziyadah', this.value)" class="p-1.5 border rounded" placeholder="Ziyadah">
            </div>
            <input type="text" value="${item.murojaah}" oninput="updateData(${i}, 'murojaah', this.value)" class="w-full p-1.5 border rounded" placeholder="Murojaah">
            <textarea oninput="updateData(${i}, 'catatan', this.value)" class="w-full p-1.5 border rounded h-16" placeholder="Catatan">${item.catatan}</textarea>
          </div>
        `;
        container.appendChild(details);
      });
    }

    function updateData(i, field, val) {
      santriData[i][field] = val;
      saveSantriTextData();
      drawAllCanvases();
    }

    function clearAllData() {
      if (confirm('Apakah Anda yakin ingin menghapus semua foto dan data yang tersimpan di browser ini?')) {
        localStorage.clear();
        location.reload();
      }
    }

    // CANVAS DRAWING LOGIC
    function drawAllCanvases() {
      drawSinglePage('canvasPage1', santriData.slice(0, 4));
      drawSinglePage('canvasPage2', santriData.slice(4, 8));
    }

    function drawSinglePage(canvasId, items) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');

      // Background
      ctx.fillStyle = "#8bae9a";
      ctx.fillRect(0, 0, 1200, 900);

      // Bingkai Luar
      ctx.strokeStyle = "#044e3a";
      ctx.lineWidth = 6;
      ctx.strokeRect(12, 12, 1176, 876);

      ctx.strokeStyle = "#d97706";
      ctx.lineWidth = 2;
      ctx.strokeRect(18, 18, 1164, 864);

      // Header Data
      const judul = document.getElementById('input-judul').value;
      const kelas = document.getElementById('input-kelas').value;
      const periode = document.getElementById('input-periode').value;
      const instansi = document.getElementById('input-instansi').value;

      // Judul Utama (Besar)
      ctx.fillStyle = "#033829";
      ctx.font = "bold 34px Arial";
      ctx.fillText(`📖 ${judul}`, 40, 52);

      // Kelas
      ctx.fillStyle = "#065f46";
      ctx.font = "bold 20px Arial";
      ctx.fillText(kelas, 78, 82);

      // Badge Periode
      ctx.fillStyle = "#044e3a";
      ctx.beginPath();
      ctx.roundRect(78, 95, 240, 32, 8);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 15px Arial";
      ctx.fillText(`[ ${periode} ]`, 95, 116);

      // Header Kanan Logo
      ctx.font = "bold 15px Arial";
      const instansiWidth = ctx.measureText(instansi).width;
      const boxWidth = Math.max(300, instansiWidth + 85);
      const boxX = 1160 - boxWidth;

      ctx.fillStyle = "rgba(255, 255, 255, 0.92)";
      ctx.beginPath();
      ctx.roundRect(boxX, 28, boxWidth, 72, 12);
      ctx.fill();
      ctx.strokeStyle = "#d97706";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      const logoX = boxX + 10;
      const logoY = 37;
      const logoSize = 54;

      if (customLogoImg) {
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(logoX, logoY, logoSize, logoSize, 8);
        ctx.clip();
        ctx.drawImage(customLogoImg, logoX, logoY, logoSize, logoSize);
        ctx.restore();
      } else {
        ctx.fillStyle = "#044e3a";
        ctx.beginPath();
        ctx.roundRect(logoX, logoY, logoSize, logoSize, 8);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 14px Arial";
        ctx.fillText("STSQ", logoX + 8, logoY + 32);
      }

      ctx.fillStyle = "#033829";
      ctx.font = "bold 15px Arial";
      wrapText(ctx, instansi, logoX + 68, 60, boxWidth - 80, 18);

      // Line Pembatas
      ctx.strokeStyle = "rgba(4, 78, 58, 0.3)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(40, 138);
      ctx.lineTo(1160, 138);
      ctx.stroke();

      // GRID 4 KARTU
      const startX = 65;
      const startY = 155;
      const cardW = 515;
      const cardH = 340;
      const gapX = 40;
      const gapY = 25;

      items.forEach((s, idx) => {
        const col = idx % 2;
        const row = Math.floor(idx / 2);
        const x = startX + col * (cardW + gapX);
        const y = startY + row * (cardH + gapY);

        // Box Kartu
        ctx.fillStyle = "rgba(255, 255, 255, 0.92)";
        ctx.beginPath();
        ctx.roundRect(x, y, cardW, cardH, 20);
        ctx.fill();
        ctx.strokeStyle = "#044e3a";
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Foto Frame
        const photoX = x + 20;
        const photoY = y + 20;
        const photoW = 140;
        const photoH = 175;

        ctx.fillStyle = "#cbd5e1";
        ctx.beginPath();
        ctx.roundRect(photoX, photoY, photoW, photoH, 12);
        ctx.fill();
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 4;
        ctx.stroke();

        if (s.fotoImg) {
          drawAspectCropImage(ctx, s.fotoImg, photoX, photoY, photoW, photoH, 12);
        } else {
          ctx.fillStyle = "#64748b";
          ctx.font = "bold 13px Arial";
          ctx.fillText("Foto Santri", photoX + 35, photoY + 92);
        }

        // Nama Badge
        const contentX = photoX + photoW + 20;
        const contentW = cardW - photoW - 50;

        ctx.fillStyle = "#fef08a";
        ctx.beginPath();
        ctx.roundRect(contentX, photoY, contentW, 36, 8);
        ctx.fill();
        ctx.strokeStyle = "#eab308";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.fillStyle = "#854d0e";
        ctx.font = "bold 18px Arial";
        ctx.fillText(s.nama, contentX + 12, photoY + 24);

        // Detail Hafalan
        const detailsList = [
          { label: "Capaian Hafalan", val: s.hafalan },
          { label: "Ziyadah Pekan Ini", val: s.ziyadah },
          { label: "Muroja'ah Pekan Ini", val: s.murojaah }
        ];

        let currY = photoY + 55;
        detailsList.forEach(item => {
          ctx.fillStyle = "#033829";
          ctx.font = "bold 12px Arial";
          ctx.fillText(item.label, contentX, currY);

          ctx.fillStyle = "#0f172a";
          ctx.font = "14px Arial";
          ctx.fillText(`: ${item.val}`, contentX + 115, currY);

          currY += 24;
        });

        // Box Catatan Ustaz
        const catY = photoY + photoH + 15;
        const catW = cardW - 40;
        const catH = cardH - photoH - 50;

        ctx.fillStyle = "#f1f5f9";
        ctx.beginPath();
        ctx.roundRect(photoX, catY, catW, catH, 10);
        ctx.fill();
        ctx.strokeStyle = "#cbd5e1";
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.fillStyle = "#044e3a";
        ctx.font = "bold 12px Arial";
        ctx.fillText("Catatan Pengampu:", photoX + 12, catY + 20);

        ctx.fillStyle = "#334155";
        ctx.font = "italic 13px Arial";
        wrapText(ctx, s.catatan, photoX + 12, catY + 40, catW - 24, 18);
      });
    }

    // Helper Crop Image
    function drawAspectCropImage(ctx, img, x, y, w, h, radius) {
      ctx.save();
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, radius);
      ctx.clip();

      const imgRatio = img.width / img.height;
      const targetRatio = w / h;
      let sw, sh, sx, sy;

      if (imgRatio > targetRatio) {
        sh = img.height;
        sw = img.height * targetRatio;
        sx = (img.width - sw) / 2;
        sy = 0;
      } else {
        sw = img.width;
        sh = img.width / targetRatio;
        sx = 0;
        sy = (img.height - sh) / 2;
      }

      ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
      ctx.restore();
    }

    // Helper Text Wrap
    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';

      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = ctx.measureText(testLine);
        const testWidth = metrics.width;
        if (testWidth > maxWidth && n > 0) {
          ctx.fillText(line, x, y);
          line = words[n] + ' ';
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, x, y);
    }

    // Download PNG
    function downloadPNG() {
      ['canvasPage1', 'canvasPage2'].forEach((id, index) => {
        const canvas = document.getElementById(id);
        const link = document.createElement('a');
        link.download = `Laporan_Tahfizh_Halaman_${index + 1}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }

    function downloadPDF() {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({
        orientation: 'landscape',
        unit: 'px',
        format: [1200, 900]
      });

      const canvas1 = document.getElementById('canvasPage1');
      const canvas2 = document.getElementById('canvasPage2');

      const imgData1 = canvas1.toDataURL('image/jpeg', 0.95);
      const imgData2 = canvas2.toDataURL('image/jpeg', 0.95);

      pdf.addImage(imgData1, 'JPEG', 0, 0, 1200, 900);
      pdf.addPage([1200, 900], 'landscape');
      pdf.addImage(imgData2, 'JPEG', 0, 0, 1200, 900);

      pdf.save('Laporan_Tahfizh_Pekanan.pdf');
    }
  </script>
</body>
</html>
