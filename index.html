<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generator Laporan Tahfizh - Clean Header</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    #canvas-wrapper {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    .canvas-preview {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 15px 25px -5px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen flex flex-col lg:flex-row">

  <!-- SIDEBAR CONTROL -->
  <div class="w-full lg:w-[420px] bg-white p-5 lg:p-6 shadow-2xl overflow-y-auto max-h-screen flex-shrink-0 z-20">
    <div class="border-b pb-3 mb-4">
      <h2 class="text-xl font-bold text-emerald-800 flex items-center gap-2">
        <span>🕌</span> LAPORAN TAHFIDZ
      </h2>
      <p class="text-xs text-slate-500">بسم الله الرحمن الرحيم</p>
    </div>

    <!-- Header Inputs -->
    <div class="space-y-3 mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200">
      <h3 class="font-bold text-xs uppercase text-slate-600">Informasi </h3>
      <div>
        <label class="block text-xs font-semibold mb-1">Judul Utama</label>
        <input type="text" id="input-judul" value="LAPORAN PEKANAN TAHFIZH" oninput="drawAllCanvases()" class="w-full p-2 border rounded text-xs">
      </div>
      <div>
        <label class="block text-xs font-semibold mb-1">Nama Kelas</label>
        <input type="text" id="input-kelas" value="KELAS VIII An-Najah" oninput="drawAllCanvases()" class="w-full p-2 border rounded text-xs">
      </div>
      <div>
        <label class="block text-xs font-semibold mb-1">Rentang Tanggal & Tahun</label>
        <input type="text" id="input-periode" value="20 - 24 JULI 2026" oninput="drawAllCanvases()" class="w-full p-2 border rounded text-xs">
      </div>
      <div>
        <label class="block text-xs font-semibold mb-1">Nama Sekolah </label>
        <input type="text" id="input-instansi" value="Sekolah Tahfidz Sahabat Qur'an" oninput="drawAllCanvases()" class="w-full p-2 border rounded text-xs">
      </div>
      <div>
        <label class="block text-xs font-semibold mb-1">Upload Logo Sekolah (STSQ)</label>
        <input type="file" id="input-logo" accept="image/*" onchange="updateLogo(event)" class="w-full p-1 border rounded text-xs">
      </div>
    </div>

    <!-- Export Buttons -->
    <div class="grid grid-cols-2 gap-2 mb-6">
      <button onclick="downloadPNG()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl text-xs shadow-md transition flex items-center justify-center gap-1">
        <span>📥</span> Unduh 2 PNG
      </button>
      <button onclick="downloadPDF()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-xl text-xs shadow-md transition flex items-center justify-center gap-1">
        <span>📄</span> Unduh PDF (2 Hal)
      </button>
    </div>

    <!-- Form Santri -->
    <div class="space-y-3">
      <h3 class="font-bold text-xs uppercase text-slate-600">Data 8 Santri</h3>
      <div id="form-container" class="space-y-2"></div>
    </div>
  </div>

  <!-- CANVAS PREVIEW AREA -->
  <div class="flex-1 p-4 sm:p-6 overflow-auto flex justify-center bg-slate-800">
    <div id="canvas-wrapper">
      <div>
        <span class="text-white text-xs font-bold mb-1 block">HALAMAN 1 (Santri 1 - 4)</span>
        <canvas id="canvasPage1" width="1200" height="900" class="canvas-preview"></canvas>
      </div>
      <div>
        <span class="text-white text-xs font-bold mb-1 block">HALAMAN 2 (Santri 5 - 8)</span>
        <canvas id="canvasPage2" width="1200" height="900" class="canvas-preview"></canvas>
      </div>
    </div>
  </div>

  <script>
    let customLogoImg = null;

    const defaultData = [
      { nama: "AKHDAN", hafalan: "2 Juz 4 HLM", ziyadah: "1 HLM", murojaah: "2 Juz 4 HLM", catatan: "Semangat dan maksimalkan hafalan lagi di pekan berikutnya.", fotoImg: null },
      { nama: "FATEH", hafalan: "2 Juz 4 HLM", ziyadah: "1 HLM", murojaah: "2 Juz 4 HLM", catatan: "Semangat dan maksimalkan target hafalan lagi.", fotoImg: null },
      { nama: "CAVA", hafalan: "1 Juz 13 HLM", ziyadah: "3 HLM", murojaah: "1 Juz 13 HLM", catatan: "Semangat dan maksimalkan target hafalan lagi.", fotoImg: null },
      { nama: "SYAFIQ", hafalan: "9 Juz", ziyadah: "20 HLM", murojaah: "9 JUZ", catatan: "Dikuatkan lagi hafalan agar tidak mudah lupa.", fotoImg: null },
      { nama: "MIZAN", hafalan: "3 Juz 2 HLM", ziyadah: "2 HLM", murojaah: "3 Juz", catatan: "Fokus pada kelancaran juz 30. Tingkatkan muraja'ah.", fotoImg: null },
      { nama: "FATIH", hafalan: "5 Juz 10 HLM", ziyadah: "4 HLM", murojaah: "4 Juz", catatan: "Alhamdulillah ziyadah pekan ini lancar.", fotoImg: null },
      { nama: "IHSAN", hafalan: "2 Juz", ziyadah: "1.5 HLM", murojaah: "2 Juz", catatan: "Perbaiki panjang pendek (mad) pada juz 29.", fotoImg: null },
      { nama: "DZULFIKAR", hafalan: "4 Juz 5 HLM", ziyadah: "3 HLM", murojaah: "4 Juz", catatan: "Pencapaian sangat baik pekan ini. Pertahankan!", fotoImg: null }
    ];

    let santriData = [...defaultData];

    function renderForms() {
      const container = document.getElementById('form-container');
      container.innerHTML = '';
      santriData.forEach((item, i) => {
        const details = document.createElement('details');
        details.className = 'bg-slate-50 rounded-lg border p-2 text-xs';
        if (i === 0) details.open = true;
        details.innerHTML = `
          <summary class="font-bold cursor-pointer text-slate-700">Santri #${i+1}: ${item.nama}</summary>
          <div class="space-y-2 pt-2">
            <input type="text" value="${item.nama}" oninput="updateData(${i}, 'nama', this.value)" class="w-full p-1.5 border rounded" placeholder="Nama">
            <input type="file" accept="image/*" onchange="updateFoto(${i}, event)" class="w-full p-1 border rounded text-[10px]">
            <div class="grid grid-cols-2 gap-1">
              <input type="text" value="${item.hafalan}" oninput="updateData(${i}, 'hafalan', this.value)" class="p-1.5 border rounded" placeholder="Hafalan">
              <input type="text" value="${item.ziyadah}" oninput="updateData(${i}, 'ziyadah', this.value)" class="p-1.5 border rounded" placeholder="Ziyadah">
            </div>
            <input type="text" value="${item.murojaah}" oninput="updateData(${i}, 'murojaah', this.value)" class="w-full p-1.5 border rounded" placeholder="Murojaah">
            <textarea oninput="updateData(${i}, 'catatan', this.value)" class="w-full p-1.5 border rounded h-16" placeholder="Catatan">${item.catatan}</textarea>
          </div>
        `;
        container.appendChild(details);
      });
    }

    function updateData(i, field, val) {
      santriData[i][field] = val;
      drawAllCanvases();
    }

    function updateFoto(i, e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          const img = new Image();
          img.onload = () => {
            santriData[i].fotoImg = img;
            drawAllCanvases();
          };
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function updateLogo(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          const img = new Image();
          img.onload = () => {
            customLogoImg = img;
            drawAllCanvases();
          };
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function drawAllCanvases() {
      drawSinglePage('canvasPage1', santriData.slice(0, 4));
      drawSinglePage('canvasPage2', santriData.slice(4, 8));
    }

    function drawSinglePage(canvasId, items) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');

      // Background
      ctx.fillStyle = "#8bae9a";
      ctx.fillRect(0, 0, 1200, 900);

      // Bingkai Luar
      ctx.strokeStyle = "#044e3a";
      ctx.lineWidth = 6;
      ctx.strokeRect(12, 12, 1176, 876);

      ctx.strokeStyle = "#d97706";
      ctx.lineWidth = 2;
      ctx.strokeRect(18, 18, 1164, 864);

      // Header Data
      const judul = document.getElementById('input-judul').value;
      const kelas = document.getElementById('input-kelas').value;
      const periode = document.getElementById('input-periode').value;
      const instansi = document.getElementById('input-instansi').value;

      // Judul Utama (Besar)
      ctx.fillStyle = "#033829";
      ctx.font = "bold 34px Arial";
      ctx.fillText(`📖 ${judul}`, 40, 52);

      // Kelas
      ctx.fillStyle = "#065f46";
      ctx.font = "bold 20px Arial";
      ctx.fillText(kelas, 78, 82);

      // Badge Periode
      ctx.fillStyle = "#044e3a";
      ctx.beginPath();
      ctx.roundRect(78, 95, 240, 32, 8);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 15px Arial";
      ctx.fillText(`[ ${periode} ]`, 95, 116);

      // Header Kanan Logo
      const instansiWidth = ctx.measureText(instansi).width;
      const boxWidth = Math.max(300, instansiWidth + 85);
      const boxX = 1160 - boxWidth;

      ctx.fillStyle = "rgba(255, 255, 255, 0.92)";
      ctx.beginPath();
      ctx.roundRect(boxX, 28, boxWidth, 72, 12);
      ctx.fill();
      ctx.strokeStyle = "#d97706";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      const logoX = boxX + 10;
      const logoY = 37;
      const logoSize = 54;

      if (customLogoImg) {
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(logoX, logoY, logoSize, logoSize, 8);
        ctx.clip();
        ctx.drawImage(customLogoImg, logoX, logoY, logoSize, logoSize);
        ctx.restore();
      } else {
        ctx.fillStyle = "#044e3a";
        ctx.beginPath();
        ctx.roundRect(logoX, logoY, logoSize, logoSize, 8);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 14px Arial";
        ctx.fillText("STSQ", logoX + 8, logoY + 32);
      }

      ctx.fillStyle = "#033829";
      ctx.font = "bold 15px Arial";
      wrapText(ctx, instansi, logoX + 68, 60, boxWidth - 80, 18);

      // Line Pembatas
      ctx.strokeStyle = "rgba(4, 78, 58, 0.3)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(40, 138);
      ctx.lineTo(1160, 138);
      ctx.stroke();

      // GRID 4 KARTU
      const startX = 65;
      const startY = 155;
      const cardW = 515;
      const cardH = 340;
      const gapX = 40;
      const gapY = 25;

      items.forEach((s, idx) => {
        const col = idx % 2;
        const row = Math.floor(idx / 2);
        const x = startX + col * (cardW + gapX);
        const y = startY + row * (cardH + gapY);

        // Box Kartu
        ctx.fillStyle = "rgba(255, 255, 255, 0.72)";
        ctx.beginPath();
        ctx.roundRect(x, y, cardW, cardH, 20);
        ctx.fill();
        ctx.strokeStyle = "#044e3a";
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Foto Frame
        const photoX = x + 20;
        const photoY = y + 20;
        const photoW = 140;
        const photoH = 175;

        ctx.fillStyle = "#cbd5e1";
        ctx.beginPath();
        ctx.roundRect(photoX, photoY, photoW, photoH, 12);
        ctx.fill();
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 4;
        ctx.stroke();

        if (s.fotoImg) {
          drawAspectCropImage(ctx, s.fotoImg, photoX, photoY, photoW, photoH, 12);
        } else {
          ctx.fillStyle = "#64748b";
          ctx.font = "bold 13px Arial";
          ctx.fillText("Foto Santri", photoX + 35, photoY + 92);
        }

        // Nama Badge
        const contentX = photoX + photoW + 20;
        const contentW = cardW - photoW - 60;

        ctx.fillStyle = "#fef08a";
        ctx.beginPath();
        ctx.roundRect(contentX, photoY, contentW, 36, 8);
        ctx.fill();
        ctx.strokeStyle = "#eab308";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.fillStyle = "#0f172a";
        ctx.font = "bold 20px Arial";
        ctx.textAlign = "center";
        ctx.fillText(s.nama || "SANTRI", contentX + contentW / 2, photoY + 23);
        ctx.textAlign = "left";

        // Pita Indikator Hafalan
        const drawRibbon = (ry, label, val) => {
          ctx.fillStyle = "#fef08a";
          ctx.beginPath();
          ctx.roundRect(contentX, ry, contentW, 36, 8);
          ctx.fill();

          ctx.fillStyle = "#1e293b";
          ctx.font = "15px Arial";
          ctx.fillText(`📖 ${label}: `, contentX + 12, ry + 22);
          ctx.font = "bold 15px Arial";
          ctx.fillText(val, contentX + 12 + ctx.measureText(`📖 ${label}: `).width, ry + 22);
        };

        drawRibbon(photoY + 46, "Jml Hafalan", s.hafalan);
        drawRibbon(photoY + 92, "Ziyadah", s.ziyadah);
        drawRibbon(photoY + 138, "Muraja'ah", s.murojaah);

        // Kotak Catatan
        const notesY = photoY + photoH + 15;
        const notesW = cardW - 40;
        const notesH = 105;

        ctx.fillStyle = "#fef08a";
        ctx.beginPath();
        ctx.roundRect(photoX, notesY, notesW, notesH, 10);
        ctx.fill();
        ctx.strokeStyle = "#fde047";
        ctx.stroke();

        ctx.fillStyle = "#713f12";
        ctx.font = "bold 16px Arial";
        ctx.fillText("📝 Catatan:", photoX + 15, notesY + 22);

        ctx.fillStyle = "#1e293b";
        ctx.font = "14px Arial";
        wrapText(ctx, s.catatan || "-", photoX + 15, notesY + 42, notesW - 30, 16);
      });

      // Footer
      ctx.fillStyle = "#033829";
      ctx.font = "bold 13px Arial";
      ctx.fillText("*STSQ An-Najah EST 6 KLS VIII", 40, 878);
      ctx.fillText(instansi, 1160 - ctx.measureText(instansi).width, 878);
    }

    function drawAspectCropImage(ctx, img, x, y, width, height, radius) {
      ctx.save();
      ctx.beginPath();
      ctx.roundRect(x, y, width, height, radius);
      ctx.clip();

      const imgWidth = img.naturalWidth || img.width;
      const imgHeight = img.naturalHeight || img.height;

      const aspect = imgWidth / imgHeight;
      const targetAspect = width / height;

      let renderW, renderH, offsetX, offsetY;

      if (aspect > targetAspect) {
        renderH = height;
        renderW = height * aspect;
        offsetY = 0;
        offsetX = (width - renderW) / 2;
      } else {
        renderW = width;
        renderH = width / aspect;
        offsetX = 0;
        offsetY = (height - renderH) / 2;
      }

      ctx.drawImage(img, x + offsetX, y + offsetY, renderW, renderH);
      ctx.restore();
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      for (let n = 0; n < words.length; n++) {
        let testLine = line + words[n] + ' ';
        let metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          ctx.fillText(line, x, y);
          line = words[n] + ' ';
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, x, y);
    }

    // Unduh 2 PNG
    function downloadPNG() {
      const c1 = document.getElementById('canvasPage1');
      const c2 = document.getElementById('canvasPage2');

      const a1 = document.createElement('a');
      a1.download = `Laporan-Tahfizh-Hal1-${Date.now()}.png`;
      a1.href = c1.toDataURL('image/png');
      a1.click();

      setTimeout(() => {
        const a2 = document.createElement('a');
        a2.download = `Laporan-Tahfizh-Hal2-${Date.now()}.png`;
        a2.href = c2.toDataURL('image/png');
        a2.click();
      }, 300);
    }

    // Unduh PDF 2 Halaman
    function downloadPDF() {
      const c1 = document.getElementById('canvasPage1');
      const c2 = document.getElementById('canvasPage2');

      const img1 = c1.toDataURL('image/png');
      const img2 = c2.toDataURL('image/png');

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('landscape', 'mm', 'a4');

      const pdfW = 297;
      const pdfH = (c1.height * pdfW) / c1.width;

      pdf.addImage(img1, 'PNG', 0, 0, pdfW, pdfH);
      pdf.addPage('landscape', 'a4');
      pdf.addImage(img2, 'PNG', 0, 0, pdfW, pdfH);

      pdf.save(`Laporan-Tahfizh-2Halaman-${Date.now()}.pdf`);
    }

    renderForms();
    drawAllCanvases();
  </script>
</body>
</html>
